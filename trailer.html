<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0a0a12" />
  <meta name="description" content="《灯谶》26 秒 v3 纯宣传电影预告片 —— 中国民俗怪谈 Roguelite 作品集宣传物料。" />
  <title>《灯谶》宣传片 ｜ Lantern Omen</title>
  <style>
    :root { --lantern: #ffdd66; --orange: #E87C30; --night: #0a0a12; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; background: var(--night); color: var(--lantern); font-family: 'Noto Serif SC', 'Songti SC', Georgia, serif; }
    body { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 18px; gap: 18px; }
    h1 { margin: 0; font-size: 20px; font-weight: 400; letter-spacing: .16em; text-align: center; text-shadow: 0 0 14px rgba(255, 221, 102, .45); }
    h1 em { color: var(--orange); font-style: normal; }
    .frame { position: relative; width: min(92vw, 960px); border: 1px solid rgba(255, 221, 102, .32); box-shadow: 0 0 60px rgba(255, 221, 102, .16), inset 0 0 30px rgba(232, 124, 48, .08); background: #000; }
    video { display: block; width: 100%; height: auto; max-height: 78vh; background: #000; }
    .meta { margin: 0; font-size: 12px; color: #9aa0b4; letter-spacing: .12em; font-family: 'JetBrains Mono', 'Menlo', monospace; }
    .actions { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; margin-top: 6px; }
    .btn { display: inline-block; padding: 9px 18px; border: 1px solid rgba(255, 221, 102, .55); color: var(--lantern); text-decoration: none; font-size: 12px; letter-spacing: .16em; transition: background .18s ease, color .18s ease; }
    .btn:hover { background: rgba(255, 221, 102, .12); }
    .btn.primary { background: rgba(232, 124, 48, .18); border-color: var(--orange); color: #ffd1a8; }
    .btn.primary:hover { background: rgba(232, 124, 48, .32); color: #fff; }
    footer { margin-top: 10px; font-size: 11px; color: #5d6275; letter-spacing: .1em; }
    @media (max-width: 640px) {
      h1 { font-size: 16px; letter-spacing: .1em; }
      body { padding: 20px 12px; gap: 14px; }
    }
  </style>
</head>
<body>
  <h1>《灯谶》宣传片 ｜ <em>26s v3 纯宣传电影预告片</em></h1>

  <div class="frame">
    <video
      src="./assets/media/%E7%81%AF%E8%B0%B6%E5%AE%A3%E4%BC%A0%E7%89%87.mp4"
      controls
      autoplay
      muted
      playsinline
      preload="metadata"
      poster=""
    ></video>
  </div>

  <p class="meta">1280 × 720 ｜ H.264 / AAC ｜ 14.2 MB ｜ 26s</p>

  <div class="actions">
    <a class="btn primary" href="./">← 返回作品集</a>
    <a class="btn" href="https://github.com/quershui-dotcom/lantern-omen-portfolio" target="_blank" rel="noopener">在 GitHub 查看</a>
  </div>

  <footer>Lantern Omen · 灯谶作品集</footer>
</body>
</html>
