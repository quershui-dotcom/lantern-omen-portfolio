<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- 符咒怨灵 - Talisman Ghost -->
  <defs>
    <filter id="talisman-glow"><feGaussianBlur stdDeviation="1.5" result="coloredBlur"/><feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <!-- 飘浮的符纸身体 -->
  <rect x="22" y="16" width="20" height="32" fill="#f5e6c8" opacity="0.85" transform="rotate(-5 32 32)"/>
  <!-- 红色咒文 -->
  <rect x="26" y="22" width="12" height="2" fill="#c41e3a"/>
  <rect x="28" y="26" width="8" height="2" fill="#c41e3a"/>
  <rect x="25" y="30" width="14" height="2" fill="#c41e3a"/>
  <rect x="27" y="34" width="10" height="2" fill="#c41e3a"/>
  <!-- 青魂眼睛 -->
  <rect x="28" y="20" width="3" height="3" fill="#1d9e75" filter="url(#talisman-glow)"/>
  <rect x="33" y="20" width="3" height="3" fill="#1d9e75" filter="url(#talisman-glow)"/>
  <!-- 撕裂边缘 -->
  <rect x="20" y="18" width="2" height="6" fill="#e8d5a3" opacity="0.7"/>
  <rect x="42" y="22" width="2" height="5" fill="#e8d5a3" opacity="0.7"/>
  <rect x="21" y="42" width="3" height="6" fill="#e8d5a3" opacity="0.7"/>
  <!-- 底部飘散纸屑 -->
  <rect x="24" y="48" width="2" height="3" fill="#f5e6c8" opacity="0.6"/>
  <rect x="30" y="50" width="2" height="2" fill="#f5e6c8" opacity="0.5"/>
  <rect x="36" y="48" width="2" height="4" fill="#f5e6c8" opacity="0.6"/>
  <!-- 红绳残段 -->
  <rect x="30" y="14" width="4" height="2" fill="#c41e3a" opacity="0.6"/>
</svg>
